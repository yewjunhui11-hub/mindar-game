<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, user-scalable=no" />
  <title>Information AR - Tap to Place</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin:0; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Arial; }
    canvas, a-scene { touch-action: none; }

    #overlay{
      position:fixed; inset:0; z-index:10;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.60); color:#fff; text-align:center;
      padding:18px;
    }
    #card{
      width:min(520px, 92vw);
      background:rgba(18,18,18,0.92);
      border:1px solid rgba(255,255,255,0.14);
      border-radius:16px;
      padding:16px;
    }
    h2{ margin:0 0 8px 0; font-size:20px; }
    p{ margin:0; opacity:.9; line-height:1.45; }
    .small{ margin-top:10px; opacity:.7; font-size:12px; }
  </style>
</head>

<body>
  <div id="overlay">
    <div id="card">
      <h2 id="title">Scan the target image</h2>
      <p id="msg">Point your camera at the target to begin.</p>
      <div class="small">Tip: good lighting helps.</div>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:true"
    renderer="colorManagement: true; physicallyCorrectLights: true"
  >
    <a-assets>
      <a-asset-item id="plasticModel" src="plastic_model.glb"></a-asset-item>
    </a-assets>

    <a-camera id="cam" position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- Anchor of the image target -->
    <a-entity id="anchor" mindar-image-target="targetIndex:0"></a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector("a-scene");
    const camEl   = document.getElementById("cam");
    const anchorEl= document.getElementById("anchor");

    const overlay = document.getElementById("overlay");
    const titleEl = document.getElementById("title");
    const msgEl   = document.getElementById("msg");

    let scannedOnce = false;
    let placed = false;

    // A "placement plane" attached to the target.
    // We'll raycast onto this plane to get a tap position.
    let planeEl = null;

    function showOverlay(title, msg){
      titleEl.textContent = title;
      msgEl.textContent = msg;
      overlay.style.display = "flex";
    }
    function hideOverlay(){
      overlay.style.display = "none";
    }

    // When target is detected the first time:
    anchorEl.addEventListener("targetFound", () => {
      if (!scannedOnce){
        scannedOnce = true;

        // Create an invisible plane in front of the target for tapping
        planeEl = document.createElement("a-plane");
        planeEl.setAttribute("id", "tapPlane");
        planeEl.setAttribute("width", "2.2");
        planeEl.setAttribute("height", "1.4");
        planeEl.setAttribute("position", "0 0 0.0");
        planeEl.setAttribute("rotation", "0 0 0");
        planeEl.setAttribute("material", "opacity: 0; transparent: true;");
        anchorEl.appendChild(planeEl);

        showOverlay("Tap to place", "Tap anywhere to place the model.");
      }
    });

    // Manual raycast (works on iPhone + Android)
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    function raycastToPlane(clientX, clientY){
      if (!sceneEl.canvas || !sceneEl.camera) return null;
      if (!planeEl) return null;

      const rect = sceneEl.canvas.getBoundingClientRect();
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -(((clientY - rect.top) / rect.height) * 2 - 1);

      raycaster.setFromCamera(ndc, sceneEl.camera);

      // Intersect with the THREE object of the plane
      const planeObj = planeEl.object3D;
      const hits = raycaster.intersectObject(planeObj, true);
      if (!hits.length) return null;

      // Convert world point to anchor-local coordinates
      const worldPoint = hits[0].point.clone();
      const localPoint = anchorEl.object3D.worldToLocal(worldPoint);

      return localPoint; // THREE.Vector3 in anchor space
    }

    function placeModelAt(localPoint){
      // Create model as a child of anchor so it stays aligned with target coords
      const modelEl = document.createElement("a-entity");
      modelEl.setAttribute("gltf-model", "#plasticModel");

      // Smaller size (tweak this)
      modelEl.setAttribute("scale", "0.15 0.15 0.15");

      // Place at tapped point, slightly in front
      modelEl.setAttribute("position", `${localPoint.x} ${localPoint.y} 0.05`);

      // Optional rotation
      modelEl.setAttribute("rotation", "0 0 0");

      anchorEl.appendChild(modelEl);
    }

    function onTap(clientX, clientY){
      if (!scannedOnce) return;
      if (placed) return; // only place once; tell me if you want re-place

      const localPoint = raycastToPlane(clientX, clientY);
      if (!localPoint) return;

      placed = true;
      hideOverlay();
      placeModelAt(localPoint);
    }

    window.addEventListener("touchstart", (e) => {
      if (!e.touches || !e.touches.length) return;
      const t = e.touches[0];
      onTap(t.clientX, t.clientY);
    }, { passive:true });

    window.addEventListener("mousedown", (e) => {
      onTap(e.clientX, e.clientY);
    });

    // If target is lost, we do nothing (model stays).
    // But note: tracking quality affects stability.
    anchorEl.addEventListener("targetLost", () => {
      if (!placed && scannedOnce) {
        showOverlay("Tap to place", "Bring the target back briefly, then tap to place.");
      }
    });
  </script>
</body>
</html>
