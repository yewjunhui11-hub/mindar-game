<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
vr-mode-ui="enabled"
device-orientation-permission-ui="enabled"
renderer="colorManagement: true; physicallyCorrectLights: true; antialias"
embedded




<!-- Assets -->
<a-assets>
  <a-asset-item id="plasticModel" src="plastic_model.glb"></a-asset-item>
</a-assets>

<!-- Camera -->
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<!-- Lights -->
<a-entity light="type: ambient; intensity: 1.2"></a-entity>
<a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>

<!-- Image target -->
<a-entity id="anchor" mindar-image-target="targetIndex: 0">

  <!-- 3D model -->
  <a-entity
    id="model"
    gltf-model="#plasticModel"
    position="0 0 0"
    rotation="0 0 0"
    scale="0.2 0.2 0.2"
    visible="false">
  </a-entity>

</a-entity>
